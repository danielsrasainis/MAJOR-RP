name: Build

# Trigger the workflow on any pull request, push or manual dispatch
on: [pull_request, push, workflow_dispatch]

jobs:
  windows:
    strategy:
      matrix:
        platform: [win32, x64]  # MAJOR RP: win32 = game client, x64 = Windows server (32-bit server is no longer supported)
    name: windows-${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat release ${{ matrix.platform }}
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Create build artifacts
        run: utils\premake5 compose_files

      - uses: actions/upload-artifact@v6
        with:
          name: MAJORRP-${{ matrix.platform }}
          path: InstallFiles/

  package-windows:
    # MAJOR RP: one ready-to-run folder = 32-bit client + 64-bit Windows server
    name: package-windows
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MAJORRP-win32
          path: MAJORRP
      - uses: actions/download-artifact@v7
        with:
          name: MAJORRP-x64
          path: x64
      - name: Add the 64-bit Windows server to the client folder
        run: |
          cp -rn x64/server/. MAJORRP/server/
          rm -rf MAJORRP/tests   # developer unit tests (Tests_Client.exe), not needed to play or host
          # MAJOR RP: never overwrite a server's own settings when updating. Ship default configs
          # as *.default; on a brand-new install, rename them (drop ".default").
          for f in MAJORRP/server/mods/deathmatch/*.conf MAJORRP/server/mods/deathmatch/*.xml; do
            [ -e "$f" ] && mv "$f" "$f.default"
          done
          ls -la MAJORRP/server MAJORRP/server/x64 || true
      - uses: actions/upload-artifact@v6
        with:
          name: MAJORRP-windows
          path: MAJORRP/

  installer:
    # MAJOR RP: player installer "MRP_installer.exe" (client only, no server), built from the win32 client
    name: installer
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Shared/installer
      - uses: actions/download-artifact@v7
        with:
          name: MAJORRP-win32
          path: client
      - name: Build installer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          rm -rf client/server client/tests   # players don't need the server or the developer unit tests
          mkdir -p out
          cd Shared/installer
          makensis -V2 -DSRC_DIR="$GITHUB_WORKSPACE/client" -DOUT_FILE="$GITHUB_WORKSPACE/out/MRP_installer.exe" -DVERSION="1.0.0.${{ github.run_number }}" majorrp.nsi
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: MAJORRP-installer
          path: out/

  linux:
    strategy:
      matrix:
        architecture: [x64]  # MAJOR RP: Linux server for a future VPS
    name: linux-${{ matrix.architecture }}
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Build
        run: /docker-entrypoint.sh --arch=${{ matrix.architecture }}
